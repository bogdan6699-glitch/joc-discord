<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Runner Deluxe</title>
  <style>
    body {
      background-color: #080813;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }

    .container {
      background: #111124;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 255, 245, 0.2);
      text-align: center;
      max-width: 680px;
      width: 100%;
      border: 1px solid #1e1e42;
      box-sizing: border-box;
    }

    h1 {
      color: #00fff5;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(0, 255, 245, 0.6);
      font-size: 28px;
      letter-spacing: 2px;
    }

    .btn-login {
      background-color: #5865F2;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      display: inline-block;
      margin-top: 15px;
      box-shadow: 0 4px 18px rgba(88, 101, 242, 0.5);
      transition: transform 0.2s;
    }

    .btn-login:hover {
      transform: scale(1.05);
    }

    canvas {
      background: #05050d;
      border: 2px solid #00fff5;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      box-shadow: inset 0 0 20px rgba(0, 255, 245, 0.1);
    }

    .stats {
      margin-top: 15px;
      background: #181835;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      display: flex;
      justify-content: space-around;
      border: 1px solid #262654;
    }

    .status-msg {
      margin-top: 12px;
      font-weight: bold;
      min-height: 24px;
    }

    .error { color: #ff4d4d; }
    .success { color: #00ff88; }

    .legend {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CYBER-RUNNER DELUXE</h1>
    <p style="color: #8a8aa8; margin-top: 0;">Săritură dublă • Power-up-uri • Dronă Aeriană</p>

    <div id="auth-section">
      <a href="/login-discord" class="btn-login">Conectează-te cu Discord</a>
    </div>

    <div id="game-section" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
        <span style="font-size: 14px;">Jucător: <strong id="username-display" style="color: #00fff5;">-</strong></span>
        <span style="font-size: 13px; color: #8a8aa8;">[SPACE / CLICK] - Sări / Double Jump</span>
      </div>

      <canvas id="gameCanvas" width="620" height="220"></canvas>

      <div class="legend">
        <div class="legend-item"><span class="dot" style="background: #ffd700;"></span> Monedă (+50p)</div>
        <div class="legend-item"><span class="dot" style="background: #00ff88;"></span> Scut</div>
        <div class="legend-item"><span class="dot" style="background: #00bfff;"></span> Slow-Mo</div>
      </div>

      <div class="stats">
        <div>Scor Cumulat: <strong id="score-display" style="color: #00fff5;">0</strong> p</div>
        <div>Încercări Rămase: <strong id="attempts-display" style="color: #ff0055;">3</strong>/3</div>
      </div>

      <div id="status-message" class="status-msg"></div>

      <!-- Secțiune Clasament -->
      <div style="margin-top: 25px; text-align: left;">
        <h3 style="color: #00fff5; margin-bottom: 10px; text-align: center; font-size: 18px;">🏆 TOP 10 JUCĂTORI</h3>
        <table style="width: 100%; border-collapse: collapse; background: #161633; border-radius: 8px; overflow: hidden; font-size: 14px;">
          <thead>
            <tr style="background: #202048; color: #00fff5;">
              <th style="padding: 10px; text-align: left;">#</th>
              <th style="padding: 10px; text-align: left;">Jucător</th>
              <th style="padding: 10px; text-align: right;">Scor Total</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr>
              <td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Se încarcă clasamentul...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let userDiscordId = null;
    let userDiscordName = null;

    function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const discord_id = urlParams.get('discord_id');
      const username = urlParams.get('username');

      if (discord_id && username) {
        localStorage.setItem('discord_id', discord_id);
        localStorage.setItem('username', username);
        window.history.replaceState({}, document.title, "/");
      }

      userDiscordId = localStorage.getItem('discord_id');
      userDiscordName = localStorage.getItem('username');

      if (userDiscordId) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
        document.getElementById('username-display').innerText = userDiscordName;
        incarcaStatistici();
        incarcaLeaderboard();
      }
    }

    async function incarcaStatistici() {
      try {
        const res = await fetch(`/api/jucator/${userDiscordId}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('score-display').innerText = data.jucator.scor_total || 0;
          document.getElementById('attempts-display').innerText = data.jucator.incercari_ramase ?? 3;
        }
      } catch (err) {
        console.error("Eroare statistici:", err);
      }
    }

    async function incarcaLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const tbody = document.getElementById('leaderboard-body');

        if (data.success && data.leaderboard.length > 0) {
          tbody.innerHTML = data.leaderboard.map((j, index) => {
            let medal = `${index + 1}.`;
            if (index === 0) medal = '🥇 1.';
            if (index === 1) medal = '🥈 2.';
            if (index === 2) medal = '🥉 3.';

            return `
              <tr style="border-bottom: 1px solid #222248;">
                <td style="padding: 10px; font-weight: bold;">${medal}</td>
                <td style="padding: 10px;">${j.nume_discord}</td>
                <td style="padding: 10px; text-align: right; color: #00fff5; font-weight: bold;">${j.scor_total} p</td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Niciun scor înregistrat săptămâna aceasta.</td></tr>';
        }
      } catch (err) {
        console.error("Eroare la afișarea clasamentului:", err);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let currentScore = 0;
    let gameSpeed = 1.5;
    let gameLoopId;

    const player = {
      x: 60,
      y: 154,
      width: 26,
      height: 26,
      dy: 0,
      gravity: 0.45,
      jumpPower: -8.5,
      jumpsLeft: 2,
      hasShield: false,
      slowMoTimer: 0
    };

    let obstacles = [];
    let items = [];
    let particles = [];
    let playerTrail = [];
    let obstacleTimer = 0;
    let itemTimer = 0;

    function createExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          color,
          life: 25
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawPlayer() {
      playerTrail.push({ x: player.x, y: player.y });
      if (playerTrail.length > 6) playerTrail.shift();

      playerTrail.forEach((t, index) => {
        ctx.fillStyle = `rgba(0, 255, 245, ${0.08 * (index + 1)})`;
        ctx.fillRect(t.x, t.y, player.width, player.height);
      });

      if (player.hasShield) {
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + 13, player.y + 13, 20, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = player.slowMoTimer > 0 ? '#00bfff' : '#00fff5';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function spawnObstacles() {
      obstacleTimer++;
      let interval = Math.max(50, 130 - Math.floor(currentScore / 25));

      if (obstacleTimer > interval) {
        const rand = Math.random();
        if (rand < 0.4) {
          obstacles.push({ x: canvas.width, y: 155, width: 20, height: 25, color: '#ff0055', type: 'ground' });
        } else if (rand < 0.7) {
          obstacles.push({ x: canvas.width, y: 140, width: 28, height: 40, color: '#ff5500', type: 'ground_high' });
        } else {
          obstacles.push({ x: canvas.width, y: 95, width: 35, height: 18, color: '#ff00aa', type: 'air' });
        }
        obstacleTimer = 0;
      }
    }

    function spawnItems() {
      itemTimer++;
      if (itemTimer > 200) {
        const rand = Math.random();
        let itemType = 'coin';
        let color = '#ffd700';

        if (rand > 0.7) { itemType = 'shield'; color = '#00ff88'; }
        else if (rand > 0.45) { itemType = 'slowmo'; color = '#00bfff'; }

        items.push({
          x: canvas.width,
          y: Math.random() < 0.5 ? 130 : 85,
          width: 16,
          height: 16,
          type: itemType,
          color: color
        });
        itemTimer = 0;
      }
    }

    function updateGame() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#22224d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 180);
      ctx.lineTo(canvas.width, 180);
      ctx.stroke();

      if (player.slowMoTimer > 0) player.slowMoTimer--;
      let currentSpeed = player.slowMoTimer > 0 ? gameSpeed * 0.6 : gameSpeed;

      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y >= 154) {
        player.y = 154;
        player.dy = 0;
        player.jumpsLeft = 2;
      }

      gameSpeed = 1.5 + (currentScore / 250);

      spawnObstacles();
      spawnItems();

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= currentSpeed;

        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          if (player.hasShield) {
            player.hasShield = false;
            createExplosion(obs.x, obs.y, '#00ff88', 20);
            obstacles.splice(i, 1);
            continue;
          } else {
            endGame();
            return;
          }
        }

        if (obs.x < -40) {
          obstacles.splice(i, 1);
          currentScore += 10;
        }
      }

      for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.x -= currentSpeed;

        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(item.x + 8, item.y + 8, 8, 0, Math.PI * 2);
        ctx.fill();

        if (
          player.x < item.x + item.width &&
          player.x + player.width > item.x &&
          player.y < item.y + item.height &&
          player.y + player.height > item.y
        ) {
          createExplosion(item.x, item.y, item.color, 15);
          if (item.type === 'coin') currentScore += 50;
          if (item.type === 'shield') player.hasShield = true;
          if (item.type === 'slowmo') player.slowMoTimer = 200;
          items.splice(i, 1);
        } else if (item.x < -20) {
          items.splice(i, 1);
        }
      }

      updateParticles();
      drawPlayer();

      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Arial';
      ctx.fillText(`Scor: ${currentScore}`, 12, 22);
      ctx.fillText(`Viteză: ${(currentSpeed).toFixed(1)}x`, 530, 22);

      if (player.slowMoTimer > 0) {
        ctx.fillStyle = '#00bfff';
        ctx.fillText(`⏱️ SLOW-MO`, 260, 22);
      }

      gameLoopId = requestAnimationFrame(updateGame);
    }

    function startGame() {
      if (isPlaying) return;
      document.getElementById('status-message').innerText = "";
      isPlaying = true;
      currentScore = 0;
      gameSpeed = 1.5;
      obstacles = [];
      items = [];
      particles = [];
      playerTrail = [];
      player.y = 154;
      player.hasShield = false;
      player.slowMoTimer = 0;
      player.jumpsLeft = 2;
      updateGame();
    }

    async function endGame() {
      isPlaying = false;
      cancelAnimationFrame(gameLoopId);

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 22px Arial';
      ctx.fillText(`GAME OVER! Scor: ${currentScore}`, 160, 100);

      const statusDiv = document.getElementById('status-message');
      statusDiv.className = "status-msg";
      statusDiv.innerText = "Se salvează scorul...";

      try {
        const response = await fetch('/api/salveaza-scor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            discord_id: userDiscordId,
            nume_discord: userDiscordName,
            scorObtinut: currentScore
          })
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = "status-msg success";
          statusDiv.innerText = "✅ " + data.message;
          document.getElementById('score-display').innerText = data.scor_total;
          document.getElementById('attempts-display').innerText = data.incercari_ramase;
          incarcaLeaderboard();
        } else {
          statusDiv.className = "status-msg error";
          statusDiv.innerText = "❌ " + data.message;
        }
      } catch (err) {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "❌ Eroare la comunicarea cu serverul!";
      }
    }

    function handleJump() {
      if (!isPlaying) {
        startGame();
      } else if (player.jumpsLeft > 0) {
        player.dy = player.jumpPower;
        player.jumpsLeft--;
        createExplosion(player.x + 10, player.y + 20, '#00fff5', 6);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleJump();
      }
    });

    canvas.addEventListener('click', handleJump);
    initAuth();
  </script>
</body>
</html>
