<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Runner Game</title>
  <style>
    body {
      background-color: #0b0b1a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }

    .container {
      background: #14142b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 255, 245, 0.15);
      text-align: center;
      max-width: 650px;
      width: 100%;
      border: 1px solid #222244;
      box-sizing: border-box;
    }

    h1 {
      color: #00fff5;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
    }

    .btn-login {
      background-color: #5865F2;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      display: inline-block;
      margin-top: 15px;
      box-shadow: 0 4px 14px rgba(88, 101, 242, 0.4);
    }

    canvas {
      background: #080811;
      border: 2px solid #00fff5;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
    }

    .stats {
      margin-top: 15px;
      background: #1c1c3c;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      display: flex;
      justify-content: space-around;
    }

    .status-msg {
      margin-top: 10px;
      font-weight: bold;
    }

    .error { color: #ff4d4d; }
    .success { color: #00ff88; }
  </style>
</head>
<body>

  <div class="container">
    <h1>CYBER-RUNNER</h1>
    <p>Sari peste obstacole! Jocul devine din ce în ce mai rapid!</p>

    <div id="auth-section">
      <a href="/login-discord" class="btn-login">Conectează-te cu Discord</a>
    </div>

    <div id="game-section" style="display: none;">
      <h3>Salut, <span id="username-display" style="color: #00fff5;">Jucător</span>!</h3>
      <p style="font-size: 13px; color: #aaa;">Apasă <strong>SPACE</strong> sau <strong>CLICK</strong> pe joc pentru a sări.</p>

      <canvas id="gameCanvas" width="600" height="200"></canvas>

      <div class="stats">
        <div>Scor Cumulat: <strong id="score-display" style="color: #00fff5;">0</strong> p</div>
        <div>Încercări Rămase: <strong id="attempts-display" style="color: #ff0055;">3</strong>/3</div>
      </div>

      <div id="status-message" class="status-msg"></div>

      <!-- Secțiune Clasament -->
      <div style="margin-top: 25px; text-align: left;">
        <h3 style="color: #00fff5; margin-bottom: 10px; text-align: center;">🏆 TOP 10 JUCĂTORI</h3>
        <table style="width: 100%; border-collapse: collapse; background: #1c1c3c; border-radius: 8px; overflow: hidden;">
          <thead>
            <tr style="background: #252550; color: #00fff5;">
              <th style="padding: 10px; text-align: left;">#</th>
              <th style="padding: 10px; text-align: left;">Jucător</th>
              <th style="padding: 10px; text-align: right;">Scor Total</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr>
              <td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Se încarcă clasamentul...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let userDiscordId = null;
    let userDiscordName = null;

    function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const discord_id = urlParams.get('discord_id');
      const username = urlParams.get('username');

      if (discord_id && username) {
        localStorage.setItem('discord_id', discord_id);
        localStorage.setItem('username', username);
        window.history.replaceState({}, document.title, "/");
      }

      userDiscordId = localStorage.getItem('discord_id');
      userDiscordName = localStorage.getItem('username');

      if (userDiscordId) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
        document.getElementById('username-display').innerText = userDiscordName;
        incarcaStatistici();
        incarcaLeaderboard();
      }
    }

    async function incarcaStatistici() {
      try {
        const res = await fetch(`/api/jucator/${userDiscordId}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('score-display').innerText = data.jucator.scor_total || 0;
          document.getElementById('attempts-display').innerText = data.jucator.incercari_ramase ?? 3;
        }
      } catch (err) {
        console.error("Eroare statistici:", err);
      }
    }

    async function incarcaLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const tbody = document.getElementById('leaderboard-body');

        if (data.success && data.leaderboard.length > 0) {
          tbody.innerHTML = data.leaderboard.map((j, index) => {
            let medal = `${index + 1}.`;
            if (index === 0) medal = '🥇 1.';
            if (index === 1) medal = '🥈 2.';
            if (index === 2) medal = '🥉 3.';

            return `
              <tr style="border-bottom: 1px solid #282850;">
                <td style="padding: 10px; font-weight: bold;">${medal}</td>
                <td style="padding: 10px;">${j.nume_discord}</td>
                <td style="padding: 10px; text-align: right; color: #00fff5; font-weight: bold;">${j.scor_total} p</td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Niciun scor înregistrat săptămâna aceasta.</td></tr>';
        }
      } catch (err) {
        console.error("Eroare la afișarea clasamentului:", err);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let currentScore = 0;
    let gameSpeed = 4;
    let gameLoopId;

    const player = { x: 50, y: 145, width: 25, height: 25, dy: 0, gravity: 0.55, jumpPower: -9.5, isGrounded: true };
    let obstacles = [];
    let obstacleTimer = 0;
    let spawnInterval = 100;

    function drawPlayer() {
      ctx.fillStyle = 'rgba(0, 255, 245, 0.3)';
      ctx.fillRect(player.x - 8, player.y + 4, player.width, player.height - 4);

      ctx.fillStyle = '#00fff5';
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawObstacles() {
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      });
    }

    function updateGame() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#222244';
      ctx.beginPath();
      ctx.moveTo(0, 170);
      ctx.lineTo(600, 170);
      ctx.stroke();

      player.dy += player.gravity;
      player.y += player.dy;

      if (player.y >= 145) {
        player.y = 145;
        player.dy = 0;
        player.isGrounded = true;
      }

      gameSpeed = 4 + (currentScore / 80); 
      spawnInterval = Math.max(45, 100 - Math.floor(currentScore / 40));

      obstacleTimer++;
      if (obstacleTimer > spawnInterval) {
        const types = [
          { width: 15, height: 25, y: 145, color: '#ff0055' },
          { width: 25, height: 35, y: 135, color: '#ff5500' },
          { width: 35, height: 20, y: 150, color: '#ff00aa' }
        ];
        const chosen = types[Math.floor(Math.random() * types.length)];
        obstacles.push({ x: canvas.width, ...chosen });
        obstacleTimer = 0;
      }

      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].x -= gameSpeed;

        if (
          player.x < obstacles[i].x + obstacles[i].width &&
          player.x + player.width > obstacles[i].x &&
          player.y < obstacles[i].y + obstacles[i].height &&
          player.y + player.height > obstacles[i].y
        ) {
          endGame();
          return;
        }
      }

      if (obstacles.length > 0 && obstacles[0].x < -40) {
        obstacles.shift();
        currentScore += 10;
      }

      drawPlayer();
      drawObstacles();

      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Arial';
      ctx.fillText(`Scor: ${currentScore}`, 10, 20);
      ctx.fillText(`Viteză: ${gameSpeed.toFixed(1)}x`, 520, 20);

      gameLoopId = requestAnimationFrame(updateGame);
    }

    function startGame() {
      if (isPlaying) return;
      document.getElementById('status-message').innerText = "";
      isPlaying = true;
      currentScore = 0;
      gameSpeed = 4;
      obstacles = [];
      player.y = 145;
      updateGame();
    }

    async function endGame() {
      isPlaying = false;
      cancelAnimationFrame(gameLoopId);

      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 22px Arial';
      ctx.fillText(`GAME OVER! Scor obtinut: ${currentScore}`, 140, 90);

      const statusDiv = document.getElementById('status-message');
      statusDiv.className = "status-msg";
      statusDiv.innerText = "Se salvează scorul...";

      try {
        const response = await fetch('/api/salveaza-scor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            discord_id: userDiscordId,
            nume_discord: userDiscordName,
            scorObtinut: currentScore
          })
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = "status-msg success";
          statusDiv.innerText = "✅ " + data.message;
          document.getElementById('score-display').innerText = data.scor_total;
          document.getElementById('attempts-display').innerText = data.incercari_ramase;
          incarcaLeaderboard();
        } else {
          statusDiv.className = "status-msg error";
          statusDiv.innerText = "❌ " + data.message;
        }
      } catch (err) {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "❌ Eroare la comunicarea cu serverul!";
      }
    }

    function handleJump() {
      if (!isPlaying) {
        startGame();
      } else if (player.isGrounded) {
        player.dy = player.jumpPower;
        player.isGrounded = false;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleJump();
      }
    });

    canvas.addEventListener('click', handleJump);
    initAuth();
  </script>
</body>
</html>
