<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Dodger</title>
  <style>
    body {
      background-color: #0f0f1b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #1a1a2e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      margin-top: 0;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    canvas {
      border: 2px solid #00ffcc;
      background-color: #05050a;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
      display: block;
      margin: 20px auto;
    }

    button, .btn-login {
      background: #00ffcc;
      color: #0f0f1b;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease-in-out;
      margin: 5px;
    }

    button:hover, .btn-login:hover {
      background: #00cca3;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
    }

    #mute-btn {
      background: #ff0055;
      color: #fff;
    }

    #mute-btn:hover {
      background: #cc0044;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #333;
      text-align: center;
    }

    th {
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>NEON DODGER</h1>
    <p style="color: #8a8aa8; margin-top: 0; font-size: 14px;">Folosește SĂGEȚILE (⬅️ / ➡️) sau tastele A / D pentru mișcare.</p>
    
    <!-- Audio & Mute -->
    <audio id="bg-music" src="bg-music.mp3" loop></audio>
    <button id="mute-btn" onclick="toggleMute()">🔊 Muzică: ON</button>

    <!-- Auth Section -->
    <div id="auth-section">
      <a href="/login-discord" class="btn-login">Conectează-te cu Discord</a>
    </div>

    <!-- Game Section -->
    <div id="game-section" style="display: none;">
      <p>Jucător: <b id="username-display" style="color: #00ffcc;">-</b></p>
      <canvas id="gameCanvas" width="400" height="500"></canvas>
      <p>Scor curent: <span id="score">0</span></p>
      <p id="status-message" style="color: #ff0055; font-weight: bold;"></p>
      <button onclick="startGame()">Start Joc</button>

      <!-- Leaderboard Section -->
      <h3 style="color: #00ffcc; margin-top: 25px;">Top Jucători</h3>
      <table>
        <thead>
          <tr>
            <th>Loc</th>
            <th>Nume</th>
            <th>Scor Max</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="3">Se încarcă clasamentul...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const MY_DISCORD_ID = '1215302644357140482';

    // Setări Audio
    const bgMusic = document.getElementById('bg-music');
    const muteBtn = document.getElementById('mute-btn');

    if (bgMusic) {
      bgMusic.volume = 0.2;
    }

    function toggleMute() {
      if (bgMusic.muted) {
        bgMusic.muted = false;
        muteBtn.innerText = "🔊 Muzică: ON";
      } else {
        bgMusic.muted = true;
        muteBtn.innerText = "🔇 Muzică: OFF";
      }
    }

    // Auth Discord
    let userDiscordId = null;
    let userDiscordName = null;

    function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const discord_id = urlParams.get('discord_id');
      const username = urlParams.get('username');

      if (discord_id && username) {
        localStorage.setItem('discord_id', discord_id);
        localStorage.setItem('username', username);
        window.history.replaceState({}, document.title, "/");
      }

      userDiscordId = localStorage.getItem('discord_id');
      userDiscordName = localStorage.getItem('username');

      if (userDiscordId) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
        document.getElementById('username-display').innerText = userDiscordName || 'Jucător';
        loadLeaderboard();
      }
    }

    // Încărcare Leaderboard din Server
    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        if (!res.ok) return;
        const data = await res.json();
        
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">Niciun scor înregistrat.</td></tr>';
          return;
        }

        data.forEach((player, index) => {
          const row = `<tr>
            <td>${index + 1}</td>
            <td>${player.username || 'Anonim'}</td>
            <td>${player.high_score || 0}</td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (err) {
        console.log("Eroare la încărcarea clasamentului:", err);
      }
    }

    // Salvare Scor
    async function saveScore(score) {
      if (!userDiscordId) return;
      try {
        await fetch('/api/salveaza-scor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discord_id: userDiscordId, score: score })
        });
        loadLeaderboard();
      } catch (e) {
        console.log("Eroare la salvarea scorului.");
      }
    }

    // Logica Jocului (Canvas + 60 FPS)
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;

    let isPlaying = false;
    let currentScore = 0;
    let lastFrameTime = performance.now();
    const TARGET_FPS = 60;
    const FRAME_DURATION = 1000 / TARGET_FPS;

    let player = { x: 180, y: 440, width: 40, height: 40, speed: 5 };
    let obstacles = [];
    let keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    function startGame() {
      if (bgMusic) {
        bgMusic.play().catch(e => console.log("Autoplay blocat de browser."));
      }

      if (isPlaying) return;

      lastFrameTime = performance.now();
      document.getElementById('status-message').innerText = "";
      isPlaying = true;
      currentScore = 0;
      document.getElementById('score').innerText = currentScore;
      obstacles = [];
      player.x = 180;

      gameLoop(performance.now());
    }

    function gameLoop(now) {
      if (!isPlaying) return;

      const elapsed = now - lastFrameTime;

      if (elapsed >= FRAME_DURATION) {
        lastFrameTime = now - (elapsed % FRAME_DURATION);
        update();
        draw();
      }

      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        if (player.x > 0) player.x -= player.speed;
      }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        if (player.x < canvas.width - player.width) player.x += player.speed;
      }

      if (Math.random() < 0.03) {
        obstacles.push({
          x: Math.random() * (canvas.width - 30),
          y: -30,
          width: 30,
          height: 30,
          speed: 3 + Math.random() * 2
        });
      }

      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].y += obstacles[i].speed;

        if (
          player.x < obstacles[i].x + obstacles[i].width &&
          player.x + player.width > obstacles[i].x &&
          player.y < obstacles[i].y + obstacles[i].height &&
          player.y + player.height > obstacles[i].y
        ) {
          gameOver();
          return;
        }

        if (obstacles[i].y > canvas.height) {
          obstacles.splice(i, 1);
          i--;
          currentScore += 10;
          document.getElementById('score').innerText = currentScore;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = '#ff0055';
      for (let obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('status-message').innerText = "GAME OVER! Apasă 'Start Joc' pentru a reîncerca.";
      saveScore(currentScore);
    }

    initAuth();
  </script>
</body>
</html>
