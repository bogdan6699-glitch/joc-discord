<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Dodger</title>
  <style>
    body {
      background-color: #080813;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px 0;
    }

    .container {
      background: #111124;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 255, 245, 0.15);
      text-align: center;
      max-width: 680px;
      width: 100%;
      border: 1px solid #1e1e42;
      box-sizing: border-box;
    }

    h1 {
      color: #00fff5;
      margin-bottom: 5px;
      text-shadow: 0 0 12px rgba(0, 255, 245, 0.6);
      font-size: 28px;
      letter-spacing: 2px;
    }

    .btn-login {
      background-color: #5865F2;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      display: inline-block;
      margin-top: 15px;
      box-shadow: 0 4px 18px rgba(88, 101, 242, 0.4);
    }

    canvas {
      background: #05050d;
      border: 2px solid #00fff5;
      border-radius: 10px;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 245, 0.2);
    }

    .stats {
      margin-top: 15px;
      background: #181835;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      display: flex;
      justify-style: space-around;
      border: 1px solid #262654;
    }

    .status-msg {
      margin-top: 12px;
      font-weight: bold;
      min-height: 24px;
    }

    .btn-admin {
      display: none;
      margin-top: 15px;
      background: #ff0055;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    .error { color: #ff4d4d; }
    .success { color: #00ff88; }
  </style>
</head>
<body>

  <!-- Sunet de fundal -->
  <audio id="bg-music" src="bg-music.mp3" loop></audio>

  <div class="container">
    <h1>NEON DODGER</h1>
    <p style="color: #8a8aa8; margin-top: 0; font-size: 14px;">Folosește SĂGEȚILE (⬅️ / ➡️) sau tastele A / D pentru mișcare.</p>

    <div id="auth-section">
      <a href="/login-discord" class="btn-login">Conectează-te cu Discord</a>
    </div>

    <div id="game-section" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
        <span style="font-size: 14px;">Jucător: <strong id="username-display" style="color: #00fff5;">-</strong></span>
        <span style="font-size: 13px; color: #8a8aa8;">Apasă SPACE sau Click pentru Start</span>
      </div>

      <canvas id="gameCanvas" width="600" height="340"></canvas>

      <div class="stats">
        <div>Scor Curent: <strong id="current-score-display" style="color: #00fff5;">0</strong> p</div>
        <div>Încercări Săptămână: <strong id="attempts-display" style="color: #ff0055;">3</strong>/3</div>
      </div>

      <!-- Buton Admin Ascuns -->
      <button id="admin-reset-btn" class="btn-admin" onclick="executaResetAdmin()">
        ⚡ Reset Încercări Toți Jucătorii (Admin Only)
      </button>

      <div id="status-message" class="status-msg"></div>

      <!-- Clasament -->
      <div style="margin-top: 25px; text-align: left;">
        <h3 style="color: #00fff5; margin-bottom: 10px; text-align: center; font-size: 18px;">🏆 TOP 10 JUCĂTORI</h3>
        <table style="width: 100%; border-collapse: collapse; background: #161633; border-radius: 8px; overflow: hidden; font-size: 14px;">
          <thead>
            <tr style="background: #202048; color: #00fff5;">
              <th style="padding: 10px; text-align: left;">#</th>
              <th style="padding: 10px; text-align: left;">Jucător</th>
              <th style="padding: 10px; text-align: right;">Scor Total</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr>
              <td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Se încarcă clasamentul...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    // Setează ID-ul tău de Discord aici
    const MY_DISCORD_ID = '1215302644357140482';

    let userDiscordId = null;
    let userDiscordName = null;

    function initAuth() {
      const urlParams = new URLSearchParams(window.location.search);
      const discord_id = urlParams.get('discord_id');
      const username = urlParams.get('username');

      if (discord_id && username) {
        localStorage.setItem('discord_id', discord_id);
        localStorage.setItem('username', username);
        window.history.replaceState({}, document.title, "/");
      }

      userDiscordId = localStorage.getItem('discord_id');
      userDiscordName = localStorage.getItem('username');

      if (userDiscordId) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('game-section').style.display = 'block';
        document.getElementById('username-display').innerText = userDiscordName;

        if (userDiscordId === MY_DISCORD_ID) {
          document.getElementById('admin-reset-btn').style.display = 'inline-block';
        }

        incarcaStatistici();
        incarcaLeaderboard();
      }
    }

    async function executaResetAdmin() {
      if (!confirm("Ești sigur că vrei să resetezi încercările la 3/3 pentru toți jucătorii?")) return;

      try {
        const res = await fetch('/api/admin/reset-incercari', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_discord_id: userDiscordId })
        });
        const data = await res.json();
        
        if (data.success) {
          alert("✅ " + data.message);
          location.reload();
        } else {
          alert("❌ " + data.message);
        }
      } catch (err) {
        alert("Eroare la comunicarea cu serverul.");
      }
    }

    async function incarcaStatistici() {
      try {
        const res = await fetch(`/api/jucator/${userDiscordId}`);
        const data = await res.json();
        if (data.success) {
          document.getElementById('attempts-display').innerText = data.jucator.incercari_ramase ?? 3;
        }
      } catch (err) {
        console.error("Eroare statistici:", err);
      }
    }

    async function incarcaLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        const tbody = document.getElementById('leaderboard-body');

        if (data.success && data.leaderboard.length > 0) {
          tbody.innerHTML = data.leaderboard.map((j, index) => {
            let medal = `${index + 1}.`;
            if (index === 0) medal = '🥇 1.';
            if (index === 1) medal = '🥈 2.';
            if (index === 2) medal = '🥉 3.';

            return `
              <tr style="border-bottom: 1px solid #222248;">
                <td style="padding: 10px; font-weight: bold;">${medal}</td>
                <td style="padding: 10px;">${j.nume_discord}</td>
                <td style="padding: 10px; text-align: right; color: #00fff5; font-weight: bold;">${j.scor_total} p</td>
              </tr>
            `;
          }).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3" style="padding: 15px; text-align: center; color: #aaa;">Niciun scor înregistrat săptămâna aceasta.</td></tr>';
        }
      } catch (err) {
        console.error("Eroare la afișarea clasamentului:", err);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let isPlaying = false;
    let currentScore = 0;
    let gameLoopId;
    let lastFrameTime = performance.now();

    const player = { x: 285, y: 290, width: 30, height: 30, speed: 6.5 };
    let obstacles = [];
    let coins = [];
    let keys = {};
    let timer = 0;
    let difficultyMultiplier = 1;

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (!isPlaying && (e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
        startGame();
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    canvas.addEventListener('click', () => { if (!isPlaying) startGame(); });

    function drawStartScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00fff5';
      ctx.font = 'bold 20px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Apasă SPACE sau Click pentru a juca!', canvas.width / 2, canvas.height / 2);
    }

    function spawnElements() {
      timer++;

      // Frecvența de generare a cuburilor crește lent în timp
      const obstacleFrequency = Math.max(20, Math.floor(45 / difficultyMultiplier));
      if (timer % obstacleFrequency === 0) {
        obstacles.push({
          x: Math.random() * (canvas.width - 30),
          y: -25,
          width: 30 + Math.random() * 15,
          height: 18,
          speed: 1.8 + Math.random() * 1.0 // Viteza inițială lentă
        });
      }

      if (timer % 40 === 0) {
        coins.push({
          x: 15 + Math.random() * (canvas.width - 30),
          y: -20,
          radius: 8,
          speed: 2.5
        });
      }
    }

    function updateGame(now) {
      if (!isPlaying) return;

      const elapsed = now - lastFrameTime;

      // Limitare la ~60 FPS (16.6ms per cadru)
      if (elapsed >= 16.6) {
        lastFrameTime = now - (elapsed % 16.6);

        // Creștere foarte fină a vitezei doar pentru cuburi
        difficultyMultiplier += 0.0002;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width) player.x += player.speed;

        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00fff5';
        ctx.fillStyle = '#00fff5';
        ctx.fillRect(player.x, player.y, player.width, player.height);

        spawnElements();

        // Monede (viteza lor rămâne fixă)
        ctx.shadowColor = '#ffd700';
        for (let i = coins.length - 1; i >= 0; i--) {
          let c = coins[i];
          c.y += c.speed;

          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
          ctx.fill();

          if (
            c.x > player.x - c.radius &&
            c.x < player.x + player.width + c.radius &&
            c.y > player.y - c.radius &&
            c.y < player.y + player.height + c.radius
          ) {
            currentScore += 15;
            document.getElementById('current-score-display').innerText = currentScore;
            coins.splice(i, 1);
          } else if (c.y > canvas.height + 10) {
            coins.splice(i, 1);
          }
        }

        // Cuburi (obstacole ce cresc lent în viteză)
        ctx.shadowColor = '#ff0055';
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.y += obs.speed * difficultyMultiplier;

          ctx.fillStyle = '#ff0055';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

          if (
            player.x < obs.x + obs.width &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.height &&
            player.y + player.height > obs.y
          ) {
            endGame();
            return;
          }

          if (obs.y > canvas.height) {
            currentScore += 5;
            document.getElementById('current-score-display').innerText = currentScore;
            obstacles.splice(i, 1);
          }
        }

        ctx.shadowBlur = 0;
      }

      gameLoopId = requestAnimationFrame(updateGame);
    }

    function startGame() {
      // Oprește orice buclă anterioară ca să evite accelerațiile necontrolate
      if (typeof gameLoopId !== 'undefined') {
        cancelAnimationFrame(gameLoopId);
      }

      if (isPlaying) return;
      document.getElementById('status-message').innerText = "";

      // Pornire Muzică
      const bgMusic = document.getElementById('bg-music');
      if (bgMusic) {
        bgMusic.currentTime = 0;
        bgMusic.play().catch(() => {});
      }

      isPlaying = true;
      currentScore = 0;
      timer = 0;
      difficultyMultiplier = 1; // Resetează viteza cuburilor
      obstacles = [];
      coins = [];
      player.x = canvas.width / 2 - player.width / 2;
      document.getElementById('current-score-display').innerText = '0';

      lastFrameTime = performance.now();
      updateGame(lastFrameTime);
    }

    async function endGame() {
      isPlaying = false;
      cancelAnimationFrame(gameLoopId);

      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff0055';
      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 26px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`GAME OVER! Scor: ${currentScore}`, canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;

      const statusDiv = document.getElementById('status-message');
      statusDiv.className = "status-msg";
      statusDiv.innerText = "Se salvează scorul...";

      try {
        const response = await fetch('/api/salveaza-scor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            discord_id: userDiscordId,
            nume_discord: userDiscordName,
            scorObtinut: currentScore
          })
        });

        const data = await response.json();

        if (data.success) {
          statusDiv.className = "status-msg success";
          statusDiv.innerText = "✅ " + data.message;
          document.getElementById('attempts-display').innerText = data.incercari_ramase;
          incarcaLeaderboard();
        } else {
          statusDiv.className = "status-msg error";
          statusDiv.innerText = "❌ " + data.message;
        }
      } catch (err) {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "❌ Eroare la comunicarea cu serverul!";
      }
    }

    initAuth();
    drawStartScreen();
  </script>
</body>
</html>
